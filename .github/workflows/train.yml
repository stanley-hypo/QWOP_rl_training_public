name: QWOP PPO train + replay

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Init submodules
        run: git submodule update --init --recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Build physics env
        run: python scripts/build.py

      - name: Check environment
        run: python scripts/check_environment.py

      - name: Train PPO (20 updates)
        run: python scripts/train_ppo.py --updates 20 --num-threads 2 --checkpoint checkpoints/ppo_final.pt --save-interval 10 --run-name gh-run1

      - name: Export deterministic replay
        run: python scripts/export_policy_replay.py --checkpoint checkpoints/ppo_final.pt --output replays/classic_100m.bin

      - name: Search best replay (256 episodes)
        run: python scripts/search_policy_best.py --checkpoint checkpoints/ppo_final.pt --output replays/best.bin --episodes 256 --num-envs 128 --num-threads 2 --device cpu

      - uses: actions/upload-artifact@v4
        with:
          name: qwop-run1
          path: |
            checkpoints
            replays
            runs
