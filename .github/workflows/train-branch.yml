name: QWOP PPO branch (PBT race)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'branch name (f1/f2/f3/...)'
        required: true
        default: 'f1'
        type: string
      extra:
        description: 'extra train_ppo args'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

jobs:
  train:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Init submodules
        run: git submodule update --init --recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Build physics env (reward v3)
        run: python scripts/build.py

      - name: Check environment
        run: python scripts/check_environment.py

      - name: Train PPO branch
        shell: bash
        run: python scripts/train_ppo.py --updates 20000 --num-envs 64 --num-threads 2 --seed 42 --checkpoint checkpoints/ppo_${{ inputs.branch }}.pt --resume-from checkpoints/ppo_v2.pt --save-interval 500 --run-name gh-${{ inputs.branch }} ${{ inputs.extra }}

      - name: Export deterministic replay
        if: ${{ always() }}
        run: python scripts/export_policy_replay.py --checkpoint checkpoints/ppo_${{ inputs.branch }}.pt --output replays/${{ inputs.branch }}.bin

      - name: Search best replay (8192 episodes)
        if: ${{ always() }}
        run: python scripts/search_policy_best.py --checkpoint checkpoints/ppo_${{ inputs.branch }}.pt --output replays/${{ inputs.branch }}_best.bin --episodes 8192 --num-envs 256 --num-threads 2 --device cpu

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: qwop-${{ inputs.branch }}
          path: |
            checkpoints
            replays
            runs
